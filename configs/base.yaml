defaults:
  - compartmental: sir
  - network: test
  - training: test
  - observables: synthetic
  - _self_

numerical_ode_params:
  t_span: [0, 50]
  t_eval_points: 1000
  solve_ode: true

plotting:
  show_compartmental_plot: true
  save_compartmental_plot: true
  show_network_prediction_plot: true
  save_network_prediction_plot: true
  compartments_to_plot: []

loss_topology:
  enabled: true
  param_sweeps:
    beta: [0.2, 0.7, 50]  # start, end, num_points
    gamma: [0.0, 0.4, 50]
  save_dir: "results/${experiment.name}/loss_topology"
