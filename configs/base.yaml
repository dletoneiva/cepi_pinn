defaults:
  - _self_
  - model: sir
  - data: synthetic
  - training: medium
  - network: medium
  - observables: synthetic

experiment:
  name: default_experiment
  seed: 42
  device: cuda

simulation:
  t_span: [0, 30]
  num_points: 300

loss_topology:
  enabled: true
  param_sweeps:
    beta: [0.2, 0.7, 50]  # start, end, num_points
    gamma: [0.0, 0.4, 50]
  save_dir: "results/${experiment.name}/loss_topology"
