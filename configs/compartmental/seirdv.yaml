# SEIRDV (Susceptible-Exposed-Infected-Recovered-Dead-Vaccinated) model configuration
model:
  type: "SEIRDVModel"
  parameters:
    beta: 0.3   # infection rate
    sigma: 0.2  # rate of progression from E to I
    gamma: 0.1  # recovery rate
    mu: 0.02    # death rate
    nu: 0.05    # vaccination rate
  initial_conditions: [0.91, 0.02, 0.05, 0.0, 0.0, 0.02]  # S(0), E(0), I(0), R(0), D(0), V(0)
  output_size: 6
