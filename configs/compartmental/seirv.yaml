# SEIRV (Susceptible-Exposed-Infected-Recovered-Vaccinated) model configuration
model:
  type: "SEIRVModel"
  parameters:
    beta: 0.3   # infection rate
    sigma: 0.2  # rate of progression from E to I
    gamma: 0.1  # recovery rate
    nu: 0.05    # vaccination rate
  initial_conditions: [0.93, 0.02, 0.05, 0.0, 0.0]  # S(0), E(0), I(0), R(0), V(0)
  output_size: 5
