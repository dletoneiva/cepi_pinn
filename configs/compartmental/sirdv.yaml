# SIRDV (Susceptible-Infected-Recovered-Dead-Vaccinated) model configuration
model:
  type: "SIRDVModel"
  parameters:
    beta: 0.3   # infection rate
    gamma: 0.1  # recovery rate
    mu: 0.02    # death rate
    nu: 0.05    # vaccination rate
  initial_conditions: [0.93, 0.05, 0.0, 0.0, 0.02]  # S(0), I(0), R(0), D(0), V(0)
