# SIRV (Susceptible-Infected-Recovered-Vaccinated) model configuration
model:
  type: "SIRVModel"
  parameters:
    beta: 0.3   # infection rate
    gamma: 0.1  # recovery rate
    nu: 0.05    # vaccination rate
  initial_conditions: [0.95, 0.05, 0.0, 0.0]  # S(0), I(0), R(0), V(0)
  output_size: 4
