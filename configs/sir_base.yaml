# SIR Model Configuration
experiment:
  name: "sir_model_experiment"
  plot_results: true
  save_figures: true
  figures_dir: "figures"

model:
  type: "SIRModel"
  parameters:
    beta: 0.4
    gamma: 0.1

simulation:
  t_span: [0, 60]
  y0: [0.99, 0.01, 0.0]
  t_eval_points: 300

plotting:
  title: "SIR Model Simulation"
  resolution: "medium"  # low, medium, high
  show_plot: false
