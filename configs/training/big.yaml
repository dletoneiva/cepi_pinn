# Big training configuration

run_training: true

adam_epochs: 5000
adam_lr: 0.001
lbfgs_max_iter: 500
n_collocation_points: 500
log_interval: 500

# Loss weights
data_weight: 1.0
physics_weight: 1.0

# Learnable physics parameters with initial values
# Example: learnable_parameters: {"beta": 0.5, "gamma": 0.1}
learnable_parameters: {}

# MLflow settings
mlflow:
  enabled: true
  experiment_name: "pinn_training_big"
