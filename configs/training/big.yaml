# Big training configuration

run_training: true

adam_epochs: 5000
adam_lr: 0.001
lbfgs_max_iter: 500
n_collocation_points: 500
log_interval: 500

# Loss weights
data_weight: 1.0
physics_weight: 1.0

# Physics parameters (will be passed to the physics model)
physics_params: {}

# MLflow settings
mlflow:
  enabled: true
  experiment_name: "pinn_training_big"
