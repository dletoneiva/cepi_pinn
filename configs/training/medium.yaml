# Medium training configuration

run_training: true

adam_epochs: 2000
adam_lr: 0.001
lbfgs_max_iter: 200
n_collocation_points: 200
log_interval: 100

# Loss weights
data_weight: 1.0
physics_weight: 1.0

# Learnable physics parameters with initial values
# Example: learnable_parameters: {"beta": 0.5, "gamma": 0.1}
learnable_parameters: {}

# MLflow settings
mlflow:
  enabled: true
  experiment_name: "pinn_training_medium"
