# Small training configuration

run_training: true

adam_epochs: 1000
adam_lr: 0.001
lbfgs_max_iter: 100
n_collocation_points: 100
log_interval: 100

# Loss weights
data_weight: 1.0
physics_weight: 1.0

# Target compartments (which compartments to train on)
target_compartments: ["S", "I", "R"]

# Physics parameters (will be passed to the physics model)
physics_params: {}

# MLflow settings
mlflow:
  enabled: true
  experiment_name: "pinn_training_small"
