# Training configuration for testing

run_training: true

adam_epochs: 100
adam_lr: 0.001
lbfgs_max_iter: 50
n_collocation_points: 50
log_interval: 10

# Loss weights
data_weight: 1.0
physics_weight: 1.0

# Learnable physics parameters with initial values
# Example: learnable_parameters: {"beta": 0.5, "gamma": 0.1}
learnable_parameters: {}

# MLflow settings
mlflow:
  enabled: true
  experiment_name: "pinn_training_test"
