# Training configuration for testing

run_training: true

adam_epochs: 100
adam_lr: 0.001
lbfgs_max_iter: 50
n_collocation_points: 50
log_interval: 10

# Loss weights
data_weight: 1.0
physics_weight: 1.0

# Data mapping: maps CSV column names to model observables
# Simplified to work with all SIR-based models
data_mapping:
  S: S
  I: I
  R: R

# Physics parameters (will be passed to the physics model)
physics_params: {}

# MLflow settings
mlflow:
  enabled: true
  experiment_name: "pinn_training_test"
