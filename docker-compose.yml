services:
  app:
    build: .
    image: pinn-research-env
    working_dir: /app
    volumes:
      - .:/app:rw
      - mlflow_data:/mlflow_data # Movido para fora de /app para evitar conflitos
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////mlflow_data/mlflow.db
      - HYDRA_FULL_ERROR=1
      - USER=appuser
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    tty: true
    stdin_open: true
    # Comando limpo em uma linha para o Bash não se perder
    command: >
      bash -c "mkdir -p /mlflow_data/artifacts && 
      mlflow server --backend-store-uri sqlite:////mlflow_data/mlflow.db --default-artifact-root /mlflow_data/artifacts --host 0.0.0.0 --port 5000 & 
      echo '🚀 MLflow iniciado em http://localhost:5000' && 
      bash"
    user: "1000:1000"

volumes:
  mlflow_data: # O Docker gerencia esse volume de forma independente e segura