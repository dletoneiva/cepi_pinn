services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: phys-sir-env
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - HOME=/app
      - XDG_CACHE_HOME=/app/.cache
      - XDG_CONFIG_HOME=/app/.config
    tty: true           # Garante o suporte ao modo interativo
    stdin_open: true    # Garante o suporte ao modo interativo
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # Comando padrão vazio ou simples, já que você vai passar o script via CLI
    command: python3
    user: "1000:1000"