services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: phys-sir-env
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - HOME=/app
      - XDG_CACHE_HOME=/app/.cache
      - XDG_CONFIG_HOME=/app/.config
      - MLFLOW_TRACKING_URI=sqlite:///mlflow/mlflow.db
    tty: true
    stdin_open: true
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # Comando padrão vazio ou simples, já que você vai passar o script via CLI
    command: bash
    user: "1000:1000"
    ports:
      - "8888:8888"
      - "5000:5000"
