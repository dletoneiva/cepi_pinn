services:
  app:
    build: .
    image: pinn-research-env
    working_dir: /app
    volumes:
      - .:/app:rw
      - mlflow_data:/app/mlflow_logs
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow_logs/mlflow.db
      - HYDRA_FULL_ERROR=1
      - USER=appuser
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    tty: true
    stdin_open: true
    command: >
      bash -c "
        mkdir -p /app/mlflow_logs/artifacts &&
        mlflow server \
          --backend-store-uri sqlite:////app/mlflow_logs/mlflow.db \
          --default-artifact-root /app/mlflow_logs/artifacts \
          --host 0.0.0.0 --port 5000 &
        echo '🚀 MLflow Server iniciado na porta 5000' &&
        bash"
    user: "1000:1000"

volumes:
  mlflow_data: